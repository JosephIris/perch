# Dependabot version updates.
#
# Pairs with the SHA-pinned actions in build.yml: when a pinned action ships a
# new release, Dependabot opens a PR that bumps the commit SHA *and* the trailing
# `# vX` comment together, so pinning to a SHA never means going stale.
#
# This is separate from Dependabot *security* updates (enabled in repo settings),
# which patch known-vulnerable dependencies automatically regardless of schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
    commit-message:
      prefix: deps(web)

  - package-ecosystem: nuget
    directory: /src/Perch
    schedule:
      interval: weekly
    commit-message:
      prefix: deps(host)
