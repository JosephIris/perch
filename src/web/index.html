<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perch</title>
  <link rel="preload" href="/fonts/InterVariable.woff2"
        as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/xterm.css" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" role="navigation" aria-label="Sessions">
      <!-- Sidebar mode. "Sessions" is the flat, state-partitioned list;
           "Projects" groups tabs under their registered repo. aria-pressed is
           the source of truth (CSS selects on it), so the toggle can never show
           one mode while the list renders another. -->
      <div class="sidebar__mode" role="group" aria-label="Sidebar mode">
        <button id="mode-sessions" class="sidebar__mode-btn" type="button"
                aria-pressed="true">Sessions</button>
        <button id="mode-projects" class="sidebar__mode-btn" type="button"
                aria-pressed="false">Projects</button>
      </div>
      <!-- Top actions. Modeled on Claude desktop's sidebar header:
           primary verb at the top, with a labeled section ("Recents")
           between it and the session list. -->
      <div class="sidebar__top-actions">
        <button id="new-session-button"
                class="sidebar__action"
                type="button">
          <span class="sidebar__action-icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </span>
          <span class="sidebar__action-label">New session</span>
        </button>
      </div>
      <!-- Dashboard (full-window attention view). A LABELLED button, not a bare
           icon: a 4-square glyph tells you nothing about what it opens, and this
           is one of only two verbs in the sidebar. Badge = how many sessions are
           waiting on you. -->
      <div class="sidebar__top-actions">
        <button id="open-dashboard" class="sidebar__action sidebar__action--secondary"
                type="button" title="Open dashboard (Ctrl+Shift+A)">
          <span class="sidebar__action-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.4">
              <rect x="2" y="2" width="5" height="5" rx="1"/>
              <rect x="9" y="2" width="5" height="5" rx="1"/>
              <rect x="2" y="9" width="5" height="5" rx="1"/>
              <rect x="9" y="9" width="5" height="5" rx="1"/>
            </svg>
          </span>
          <span class="sidebar__action-label">Dashboard</span>
          <span class="sidebar__action-badge" id="dash-badge" style="display:none">0</span>
        </button>
      </div>
      <!-- Sections (Needs you / Projects) are rendered by sidebar.ts into
           this scroll container. -->
      <div id="sidebar-scroll" class="sidebar__scroll"></div>

      <!-- Recently closed: pinned just above the identity footer. A closed
           project archives here (instead of being deleted) so its layout +
           Claude sessions can be restored. Rendered by sidebar.ts; hidden
           when empty. -->
      <div id="recently-closed" class="recently-closed" hidden></div>

      <!-- Auto-update pill. Hidden until the host (Velopack) reports a newer
           release via an `update.available` message; sits directly above the
           identity footer. Click → host downloads + relaunches into the new
           version. Quiet accent-tinted row, not a vivid CTA, per the chrome's
           Fluent discipline. -->
      <button id="update-banner" class="update-banner" type="button" hidden
              title="Restart to update Perch" aria-label="Update available">
        <span class="update-banner__icon" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <polyline points="21 3 21 9 15 9"/>
          </svg>
        </span>
        <span class="update-banner__text">Update available</span>
        <span class="update-banner__action">Restart</span>
      </button>

      <!-- Cloud resources. Hidden entirely unless this user's agents have GCP
           machines actually running (which needs gcloud installed AND
           authenticated), so a user who doesn't drive GCP from an agent never
           sees any of it.

           Its mere PRESENCE means something is billing — hence the teal
           --color-cloud class rather than a neutral card. Escalates to caution
           and grows the alert row when a machine has no agent attached.
           Click → the cloud panel. -->
      <div id="cloud-area" class="cloud-area" hidden>
        <div class="cloud-area__label">Cloud</div>
        <button id="cloud-card" class="cloud-card" type="button" aria-label="Cloud resources">
          <span class="cloud-card__head">
            <span class="cloud-card__dot" aria-hidden="true"></span>
            <span class="cloud-card__title" id="cloud-card-title"></span>
            <span class="cloud-card__rate" id="cloud-card-rate"></span>
          </span>
          <span class="cloud-card__sub" id="cloud-card-sub"></span>
          <span class="cloud-card__alert" id="cloud-card-alert" hidden>
            <span class="cloud-card__alert-dot" aria-hidden="true"></span>
            <span class="cloud-card__alert-text" id="cloud-card-alert-text"></span>
            <span class="cloud-card__alert-cost" id="cloud-card-alert-cost"></span>
          </span>
        </button>
      </div>

      <!-- Bottom row: app identity + settings. Mirrors Claude's user-info
           row at the bottom of the sidebar. The identity block is static;
           the gear opens the settings dialog. -->
      <footer class="sidebar__footer">
        <button class="sidebar__identity" type="button"
                title="Perch" aria-label="Perch">
          <!-- The app icon itself (the monocled bird), not a re-drawn glyph —
               same mark as the window, the taskbar, and the empty states. -->
          <span class="sidebar__identity-mark" aria-hidden="true">
            <img src="/perch-logo.png" alt="" width="18" height="18" />
          </span>
          <span class="sidebar__identity-text">
            <span class="sidebar__identity-name">Perch</span>
            <span class="sidebar__identity-sub" id="status-text">starting…</span>
          </span>
        </button>
        <!-- Panel width mode. Compact (default) maximizes the terminal;
             Standard widens both rails so the session list + Inspector journal
             breathe. Segmented so both modes are always visible — a "mode" you
             can't see the alternative of reads as a mystery toggle. Persisted
             via prefs.wideLayout. -->
        <div class="sidebar__density" role="group" aria-label="Panel width">
          <button id="layout-compact" class="sidebar__density-btn" type="button"
                  aria-pressed="true" title="Compact — maximize the terminal">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.3" aria-hidden="true">
              <rect x="1.5" y="3.5" width="13" height="9" rx="1.6"/>
              <rect x="3" y="5" width="1.6" height="6" rx="0.6" fill="currentColor" stroke="none"/>
              <rect x="11.4" y="5" width="1.6" height="6" rx="0.6" fill="currentColor" stroke="none"/>
            </svg>
          </button>
          <button id="layout-standard" class="sidebar__density-btn" type="button"
                  aria-pressed="false" title="Standard — wider panels">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.3" aria-hidden="true">
              <rect x="1.5" y="3.5" width="13" height="9" rx="1.6"/>
              <rect x="3" y="5" width="3" height="6" rx="0.6" fill="currentColor" stroke="none"/>
              <rect x="10" y="5" width="3" height="6" rx="0.6" fill="currentColor" stroke="none"/>
            </svg>
          </button>
        </div>
        <button id="settings-button" class="sidebar__settings" type="button"
                title="Settings" aria-label="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </footer>
    </aside>

    <main id="workspace" class="workspace"></main>

    <!-- Inspector rail. Follows the focused pane and answers "what has this
         agent actually done and said?" without scrolling the terminal. An
         in-flow third grid column (not an overlay) so it can't cover the
         workspace; #app collapses the column to 0 when it's hidden.
         Populated entirely by inspector.ts — the markup here is just the
         shell and the mount points, same split as the sidebar. -->
    <aside id="inspector" class="inspector" aria-label="Inspector">
      <div class="inspector__head">
        <div class="inspector__following">
          <span id="inspector-tag" class="inspector__tag" aria-hidden="true"></span>
          <span id="inspector-name" class="inspector__name"></span>
        </div>
        <button id="inspector-close" class="inspector__btn" type="button"
                title="Hide inspector (Ctrl+Shift+B)">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
               stroke="currentColor" stroke-width="1.4"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6.5,4 10.5,8 6.5,12"/>
          </svg>
        </button>
      </div>
      <div id="inspector-changes" class="inspector__changes"></div>
      <div class="inspector__body">
        <div id="inspector-stream" class="inspector__stream scroll" data-feed></div>
        <button id="inspector-jump" class="inspector__jump" type="button">
          &#8595; Jump to latest
        </button>
      </div>
      <!-- Filter bar. Toggles which journal kinds show — You (your prompts +
           interrupts), Claude (prose beats), Actions (tool calls) — live and
           independently; "All" flips everything on or clears it. Turning Actions
           off IS the old prose-only view (which is why the header ☰ is gone).
           Filtering is pure CSS on the stream, so it never re-renders. -->
      <div id="inspector-filters" class="inspector__filters" role="group"
           aria-label="Filter the journal">
        <button id="filter-all" class="inspector__filter inspector__filter--all"
                type="button" aria-pressed="true" title="Show everything (or clear all)">All</button>
        <button id="filter-user" class="inspector__filter" type="button"
                data-cat="user" aria-pressed="true" title="Your messages">
          <span class="inspector__filter-glyph" aria-hidden="true">&gt;</span>You<span
                id="filter-count-user" class="inspector__filter-count"></span>
        </button>
        <button id="filter-claude" class="inspector__filter" type="button"
                data-cat="claude" aria-pressed="true" title="Claude's messages">
          <span class="inspector__filter-glyph" aria-hidden="true">&#9679;</span>Claude<span
                id="filter-count-claude" class="inspector__filter-count"></span>
        </button>
        <button id="filter-actions" class="inspector__filter" type="button"
                data-cat="actions" aria-pressed="true" title="Tool calls">
          <span class="inspector__filter-glyph" aria-hidden="true">&#9474;</span>Actions<span
                id="filter-count-actions" class="inspector__filter-count"></span>
        </button>
        <button id="filter-skill" class="inspector__filter inspector__filter--skill" type="button"
                data-cat="skill" aria-pressed="true" title="Skills the agent used">
          <span class="inspector__filter-glyph" aria-hidden="true">&#9670;</span>Skills<span
                id="filter-count-skill" class="inspector__filter-count"></span>
        </button>
      </div>
      <div id="inspector-vitals" class="inspector__vitals"></div>
    </aside>

    <!-- Dashboard: full-window attention view. Hidden until opened via the
         ▦ button or Ctrl+Shift+A. Rendered entirely by dashboard.ts. -->
    <section id="dashboard" class="dashboard" aria-hidden="true"></section>

    <!-- Toast surface for perch notify messages. Same frosted acrylic
         family as the shortcut hint but anchored slightly higher and
         auto-fades after a few seconds. -->
    <div id="toast" class="toast" role="status" aria-live="polite">
      <span class="toast__dot" aria-hidden="true"></span>
      <span class="toast__text"></span>
    </div>

    <!-- Shortcut hint card. Appears after holding Ctrl+Shift for ~300ms,
         disappears the moment a modifier is released. Frosted acrylic
         background so it sits cleanly above the terminal content. -->
    <div id="shortcut-hint" class="shortcut-hint" aria-hidden="true">
      <div class="shortcut-hint__title">Ctrl + Shift</div>
      <ul class="shortcut-hint__list">
        <li><kbd>T</kbd><span>new session</span></li>
        <li><kbd>D</kbd><span>split right</span></li>
        <li><kbd>S</kbd><span>split down</span></li>
        <li><kbd>W</kbd><span>close pane</span></li>
        <li><kbd>E</kbd><span>even out panes</span></li>
        <li><kbd>B</kbd><span>toggle inspector</span></li>
        <li><kbd>&larr;&uarr;&darr;&rarr;</kbd><span>move pane</span></li>
      </ul>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
