<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Perch hero shot</title>
  <!-- README hero composition: the real app scaffold (index.html's sidebar +
       workspace, same ids and classes) staged inside a fake Win11 window on a
       desktop backdrop. Populated by harness.js#hero with fixture sessions and
       scripted terminal content. Capture at 1600x900:

         msedge --headless --screenshot=... --window-size=1600,900 \
                --force-device-scale-factor=2 file:///...\hero.html#hero
  -->
  <style>
    @font-face {
      font-family: "Inter Variable";
      src: url("../src/web/fonts/InterVariable.woff2") format("woff2-variations");
      font-weight: 100 900;
      font-display: swap;
    }
    /* html painted dark too: at fractional device scales the body's 100vh can
       round a hair short and a white sliver of the html canvas rims the shot */
    html { background: #0c0c0e; }
    html, body { margin: 0; height: 100vh; }
    body {
      display: grid; place-items: center;
      background: radial-gradient(1100px 700px at 30% -10%,
        #1c2330 0%, #101014 55%, #0c0c0e 100%);
    }
    /* Full-bleed window: the capture IS the app window, edge to edge. No
       backdrop margin, radius, or shadow — consumers (README, site) frame
       the image themselves, and a baked-in dark mat reads as an artifact. */
    #frame {
      width: 100vw; height: 100vh;
      overflow: hidden;
      display: flex; flex-direction: column;
      background: #1a1a1c; /* stand-in for Mica, which never screenshots */
    }
    .fake-titlebar {
      height: 36px; flex: none;
      display: flex; align-items: center; gap: 8px;
      padding-left: 14px; color: #9aa0a6;
      font: 12px "Inter Variable", "Segoe UI Variable Text", "Segoe UI", sans-serif;
    }
    .fake-titlebar .caps { margin-left: auto; display: flex; }
    .fake-titlebar .cap {
      width: 46px; height: 36px; display: grid; place-items: center;
      color: #8b8f94; font-size: 10px;
    }
    #frame #app { flex: 1; min-height: 0; height: auto; }
  </style>
  <link rel="stylesheet" href="./harness.css" />
  <script>
    /* Host stub so bridge.ts binds without a WebView2 host. harness.js#hero
       installs window.__heroRoute to answer requests (inspector.request,
       inspector.image) with fixture replies, and __heroPush lets it push
       host-initiated messages (the state snapshot the inspector follows). */
    (function () {
      var listeners = [];
      window.chrome = window.chrome || {};
      window.chrome.webview = {
        postMessage: function (wire) {
          var msg; try { msg = JSON.parse(wire); } catch (e) { return; }
          var route = window.__heroRoute;
          if (!route) return;
          (route(msg) || []).forEach(function (reply) {
            var data = JSON.stringify(reply);
            setTimeout(function () {
              listeners.forEach(function (l) { l({ data: data }); });
            }, 30);
          });
        },
        addEventListener: function (t, l) { if (t === "message") listeners.push(l); },
      };
      window.__heroPush = function (obj) {
        var data = JSON.stringify(obj);
        listeners.forEach(function (l) { l({ data: data }); });
      };
    })();
  </script>
</head>
<body>
  <div id="frame">
    <div class="fake-titlebar">
      <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="7.5" fill="none" stroke="#76B9ED" stroke-width="2.4"/>
        <circle cx="12" cy="12" r="3.4" fill="#e9eef4"/>
      </svg>
      <span>perch</span>
      <span class="caps" aria-hidden="true">
        <span class="cap">&#x2500;</span><span class="cap">&#x25A2;</span><span class="cap">&#x2715;</span>
      </span>
    </div>
    <div id="app">
      <aside class="sidebar" role="navigation" aria-label="Sessions">
        <div class="sidebar__mode" role="group" aria-label="Sidebar mode">
          <button id="mode-sessions" class="sidebar__mode-btn" type="button"
                  aria-pressed="false">Sessions</button>
          <button id="mode-projects" class="sidebar__mode-btn" type="button"
                  aria-pressed="true">Projects</button>
        </div>
        <div class="sidebar__top-actions">
          <button id="new-session-button" class="sidebar__action" type="button">
            <span class="sidebar__action-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </span>
            <span class="sidebar__action-label">New session</span>
          </button>
        </div>
        <div class="sidebar__top-actions">
          <button id="open-dashboard" class="sidebar__action sidebar__action--secondary"
                  type="button" title="Open dashboard (Ctrl+Shift+A)">
            <span class="sidebar__action-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"
                   stroke="currentColor" stroke-width="1.4">
                <rect x="2" y="2" width="5" height="5" rx="1"/>
                <rect x="9" y="2" width="5" height="5" rx="1"/>
                <rect x="2" y="9" width="5" height="5" rx="1"/>
                <rect x="9" y="9" width="5" height="5" rx="1"/>
              </svg>
            </span>
            <span class="sidebar__action-label">Dashboard</span>
            <span class="sidebar__action-badge" id="dash-badge" style="display:none">0</span>
          </button>
        </div>
        <div id="sidebar-scroll" class="sidebar__scroll"></div>
        <div id="recently-closed" class="recently-closed" hidden></div>
        <div id="cloud-area" class="cloud-area" hidden>
          <div class="cloud-area__label">Cloud</div>
          <button id="cloud-card" class="cloud-card" type="button" aria-label="Cloud resources">
            <span class="cloud-card__head">
              <span class="cloud-card__dot" aria-hidden="true"></span>
              <span class="cloud-card__title" id="cloud-card-title"></span>
              <span class="cloud-card__rate" id="cloud-card-rate"></span>
            </span>
            <span class="cloud-card__sub" id="cloud-card-sub"></span>
            <span class="cloud-card__alert" id="cloud-card-alert" hidden>
              <span class="cloud-card__alert-dot" aria-hidden="true"></span>
              <span class="cloud-card__alert-text" id="cloud-card-alert-text"></span>
              <span class="cloud-card__alert-cost" id="cloud-card-alert-cost"></span>
            </span>
          </button>
        </div>
        <div id="local-area" class="local-area" hidden>
          <div class="local-area__label">Local</div>
          <button id="local-card" class="local-card" type="button" aria-label="Local dev servers">
            <span class="local-card__head">
              <span class="local-card__dot" aria-hidden="true"></span>
              <span class="local-card__title" id="local-card-title"></span>
              <span class="local-card__port" id="local-card-port"></span>
            </span>
            <span class="local-card__sub" id="local-card-sub"></span>
            <span class="local-card__alert" id="local-card-alert" hidden>
              <span class="local-card__alert-dot" aria-hidden="true"></span>
              <span class="local-card__alert-text" id="local-card-alert-text"></span>
              <span class="local-card__alert-meta" id="local-card-alert-meta"></span>
            </span>
          </button>
        </div>
        <footer class="sidebar__footer">
          <button class="sidebar__identity" type="button" title="Perch" aria-label="Perch">
            <span class="sidebar__identity-mark" aria-hidden="true">
              <img src="../src/web/perch-glyph.png" alt="" width="18" height="18" />
            </span>
            <span class="sidebar__identity-text">
              <span class="sidebar__identity-name">Perch</span>
              <span class="sidebar__identity-sub" id="status-text">7 sessions</span>
            </span>
          </button>
          <div class="sidebar__density" role="group" aria-label="Panel width">
            <button id="layout-compact" class="sidebar__density-btn" type="button"
                    aria-pressed="true" title="Compact">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
                   stroke="currentColor" stroke-width="1.3" aria-hidden="true">
                <rect x="1.5" y="3.5" width="13" height="9" rx="1.6"/>
                <rect x="3" y="5" width="1.6" height="6" rx="0.6" fill="currentColor" stroke="none"/>
                <rect x="11.4" y="5" width="1.6" height="6" rx="0.6" fill="currentColor" stroke="none"/>
              </svg>
            </button>
            <button id="layout-standard" class="sidebar__density-btn" type="button"
                    aria-pressed="false" title="Standard">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
                   stroke="currentColor" stroke-width="1.3" aria-hidden="true">
                <rect x="1.5" y="3.5" width="13" height="9" rx="1.6"/>
                <rect x="3" y="5" width="3" height="6" rx="0.6" fill="currentColor" stroke="none"/>
                <rect x="10" y="5" width="3" height="6" rx="0.6" fill="currentColor" stroke="none"/>
              </svg>
            </button>
          </div>
          <button id="settings-button" class="sidebar__settings" type="button"
                  title="Settings" aria-label="Settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </footer>
      </aside>
      <main id="workspace" class="workspace"></main>
      <aside id="inspector" class="inspector" aria-label="Inspector">
        <div class="inspector__head">
          <div class="inspector__following">
            <span id="inspector-tag" class="inspector__tag" aria-hidden="true"></span>
            <span id="inspector-name" class="inspector__name"></span>
          </div>
          <button id="inspector-close" class="inspector__btn" type="button"
                  title="Hide inspector (Ctrl+Shift+B)">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.4"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6.5,4 10.5,8 6.5,12"/>
            </svg>
          </button>
        </div>
        <div id="inspector-changes" class="inspector__changes"></div>
        <div class="inspector__body">
          <div id="inspector-stream" class="inspector__stream scroll" data-feed></div>
          <button id="inspector-jump" class="inspector__jump" type="button">
            &#8595; Jump to latest
          </button>
        </div>
        <div id="inspector-filters" class="inspector__filters" role="group"
             aria-label="Filter the journal">
          <button id="filter-all" class="inspector__filter inspector__filter--all"
                  type="button" aria-pressed="true" title="Show everything (or clear all)">All</button>
          <button id="filter-user" class="inspector__filter" type="button"
                  data-cat="user" aria-pressed="true" title="Your messages">
            <span class="inspector__filter-glyph" aria-hidden="true">&gt;</span>You<span
                  id="filter-count-user" class="inspector__filter-count"></span>
          </button>
          <button id="filter-claude" class="inspector__filter" type="button"
                  data-cat="claude" aria-pressed="true" title="Claude's messages">
            <span class="inspector__filter-glyph" aria-hidden="true">&#9679;</span>Claude<span
                  id="filter-count-claude" class="inspector__filter-count"></span>
          </button>
          <button id="filter-actions" class="inspector__filter" type="button"
                  data-cat="actions" aria-pressed="true" title="Tool calls">
            <span class="inspector__filter-glyph" aria-hidden="true">&#9474;</span>Actions<span
                  id="filter-count-actions" class="inspector__filter-count"></span>
          </button>
          <button id="filter-skill" class="inspector__filter inspector__filter--skill" type="button"
                  data-cat="skill" aria-pressed="true" title="Skills the agent used">
            <span class="inspector__filter-glyph" aria-hidden="true">&#9670;</span>Skills<span
                  id="filter-count-skill" class="inspector__filter-count"></span>
          </button>
          <button id="filter-images" class="inspector__filter" type="button"
                  data-cat="images" aria-pressed="true" title="Images in the conversation">
            <span class="inspector__filter-glyph" aria-hidden="true">&#9635;</span>Images<span
                  id="filter-count-images" class="inspector__filter-count"></span>
          </button>
        </div>
        <div id="inspector-vitals" class="inspector__vitals"></div>
      </aside>
      <section id="dashboard" class="dashboard" aria-hidden="true"></section>
    </div>
  </div>
  <script src="./harness.js"></script>
</body>
</html>
