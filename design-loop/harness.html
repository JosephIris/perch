<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Perch harness</title>
  <!-- Load Inter from the local source file so the screenshot uses the real
       bundled font (app.css's /fonts/* URL can't resolve under file://). -->
  <style>
    @font-face {
      font-family: "Inter Variable";
      src: url("../src/web/fonts/InterVariable.woff2") format("woff2-variations");
      font-weight: 100 900;
      font-display: swap;
    }
    html, body { margin: 0; height: 100vh; }
    /* Simulate the dark Mica backdrop (transparent in-app; won't screenshot). */
    body { background: #1f1f1f; }
  </style>
  <link rel="stylesheet" href="./harness.css" />
  <!-- Dev-only host stub: answers commits.request with sample unpushed-commit
       data so the "ready to push" recap (popover / hover tooltip / lightbox)
       can be screenshotted offline, the same way the harness fakes the rest of
       the host state. Defined before harness.js so bridge.ts binds to it. -->
  <script>
    (function () {
      var listeners = [];
      function iso(msAgo) { return new Date(Date.now() - msAgo).toISOString(); }
      function sample(paneId) {
        return {
          type: "commits.data", paneId: paneId, ahead: 4,
          commits: [
            { sha: "c5794d0", subject: "feat(nn-eval): Target Growth column on Datasets tab", committedIso: iso(3.6e6), author: "Joseph", added: 50, deleted: 3, inSession: true, files: [{ path: "services/nn-eval-tool/templates/index.html", added: 50, deleted: 3 }] },
            { sha: "d54d4e8", subject: "fix(ml-experiments): keep metrics tables readable with 4+ runs", committedIso: iso(5.4e6), author: "Joseph", added: 42, deleted: 3, inSession: true, files: [{ path: "services/ml-experiments/templates/index.html", added: 42, deleted: 3 }] },
            { sha: "3781094", subject: "feat(nn-preprocessing): add NN_REVENUE_AB_TEST to A/B Test Settings tab", committedIso: iso(9.0e6), author: "Joseph", added: 28, deleted: 5, inSession: false, files: [{ path: "services/nn-preprocessing-validation/app.py", added: 4, deleted: 2 }, { path: "services/nn-preprocessing-validation/templates/index.html", added: 24, deleted: 3 }] },
            { sha: "e8dcce8", subject: "perf(ssp-monitoring): cut refresh memory peak + return high-water to OS", committedIso: iso(9.6e6), author: "Joseph", added: 76, deleted: 6, inSession: false, files: [{ path: "services/ssp-monitoring/app.py", added: 64, deleted: 3 }, { path: "services/ssp-monitoring/rollup.py", added: 12, deleted: 3 }] }
          ]
        };
      }
      function reply(obj, delayMs) {
        var wire = JSON.stringify(obj);
        setTimeout(function () { listeners.forEach(function (l) { l({ data: wire }); }); }, delayMs || 0);
      }
      window.chrome = window.chrome || {};
      window.chrome.webview = {
        postMessage: function (wire) {
          var msg; try { msg = JSON.parse(wire); } catch (e) { return; }
          if (!msg) return;
          if (msg.type === "commits.request") {
            reply(sample(msg.paneId), 120);
          }
          // Team room: harness.ts parks its fixture on window.__teamFixture;
          // answer team.request with it so the room fetches the way it would
          // from the host.
          if (msg.type === "team.request" && window.__teamFixture) {
            reply(window.__teamFixture, 80);
          }
          // Your post echoes back as a ledger row so the pending row settles.
          if (msg.type === "team.post" && window.__teamFixture) {
            var fx = window.__teamFixture;
            var seq = fx.lastSeq + 1;
            var to = msg.to === null ? ["Ada"] : msg.to;
            var row = { seq: seq, ts: new Date().toISOString(), kind: "user", from: "you", to: to, text: msg.text, clientId: msg.clientId };
            fx.entries.push(row); fx.lastSeq = seq;
            reply({ type: "team.data", projectId: msg.projectId, entries: [row], lastSeq: seq }, 400);
          }
          // Brief generation: progress ticks, then a result (or an error for
          // the #newbot-error view).
          if (msg.type === "team.brief.generate") {
            var view = location.hash.replace("#", "");
            var phases = ["Reading the repo…", "Looking at src/web…", "Writing the brief…"];
            phases.forEach(function (p, i) {
              reply({ type: "team.brief.progress", jobId: msg.jobId, phase: p, elapsedMs: (i + 1) * 900 }, 300 + i * 900);
            });
            if (view === "newbot-generating") return;   // stay in progress for the shot
            if (view === "newbot-error") {
              reply({ type: "team.brief.result", jobId: msg.jobId, error: "stopped at the cost cap" }, 3200);
            } else {
              reply({ type: "team.brief.result", jobId: msg.jobId, costUsd: 0.42, brief:
                "## Role\nYou are the frontend developer for storefront-web: the sidebar, the panes, the dialogs and the CSS tokens under `src/web`.\n\n" +
                "## What you own\n- `src/web/src/sidebar.ts`, `workspace.ts`, `pane.ts` and every dialog under `src/web/src`\n- `src/web/src/style.css` and `tokens.css`\n\n" +
                "## What you never touch\n- Anything under `src/Perch` (the host) — ask the backend dev\n- `tools/perch-cli`\n\n" +
                "## Who you ask\n- The backend dev, for a new host message or a changed `state` shape\n- The designer, before inventing a new surface\n\n" +
                "## Definition of done\n`npm run typecheck` and `npm test` green, a harness screenshot for anything visual, and the constitution's checklist honoured.\n\n" +
                "## How you communicate on the team\nMessage a teammate with SendMessage by session name when you need something from them; post a note to the room when something others depend on lands." }, 3200);
            }
          }
        },
        addEventListener: function (type, listener) { if (type === "message") listeners.push(listener); }
      };
    })();
  </script>
</head>
<body>
  <div id="app">
    <aside class="sidebar" role="navigation" aria-label="Sessions">
      <div class="sidebar__top-actions">
        <button id="new-session-button" class="sidebar__action" type="button">
          <span class="sidebar__action-icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </span>
          <span class="sidebar__action-label">New session</span>
        </button>
        <button id="open-dashboard" class="sidebar__icon-btn" type="button"
                title="Open dashboard" aria-label="Open dashboard">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"
               stroke="currentColor" stroke-width="1.4">
            <rect x="2" y="2" width="5" height="5" rx="1"/>
            <rect x="9" y="2" width="5" height="5" rx="1"/>
            <rect x="2" y="9" width="5" height="5" rx="1"/>
            <rect x="9" y="9" width="5" height="5" rx="1"/>
          </svg>
          <span class="sidebar__icon-badge" id="dash-badge" style="display:none">0</span>
        </button>
      </div>
      <div id="sidebar-scroll" class="sidebar__scroll"></div>
      <!-- Mirrors index.html so #cloud / #cloud-sidebar can be captured here
           (wrapper + toggle included for fidelity; the toggle is inert — the
           harness never calls initUtilityMini). -->
      <div id="utility-areas" class="utility-areas">
        <button id="utility-mini-toggle" class="utility-mini-toggle" type="button">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M2.5 4.5 L6 8 L9.5 4.5" stroke="currentColor" stroke-width="1.4"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div id="cloud-area" class="cloud-area" hidden>
          <div class="cloud-area__label">Cloud</div>
          <button id="cloud-card" class="cloud-card" type="button" aria-label="Cloud resources">
            <span class="cloud-card__head">
              <span class="cloud-card__dot" aria-hidden="true"></span>
              <span class="cloud-card__mini" id="cloud-card-mini"></span>
              <span class="cloud-card__title" id="cloud-card-title"></span>
              <span class="cloud-card__rate" id="cloud-card-rate"></span>
            </span>
            <span class="cloud-card__sub" id="cloud-card-sub"></span>
            <span class="cloud-card__alert" id="cloud-card-alert" hidden>
              <span class="cloud-card__alert-dot" aria-hidden="true"></span>
              <span class="cloud-card__alert-text" id="cloud-card-alert-text"></span>
              <span class="cloud-card__alert-cost" id="cloud-card-alert-cost"></span>
            </span>
          </button>
        </div>
      </div>
      <footer class="sidebar__footer">
        <button class="sidebar__identity" type="button" title="Perch" aria-label="Perch">
          <span class="sidebar__identity-text">
            <span class="sidebar__identity-name">Perch</span>
            <span class="sidebar__identity-sub" id="status-text">harness</span>
          </span>
        </button>
      </footer>
    </aside>
    <main id="workspace" class="workspace"></main>
    <section id="dashboard" class="dashboard" aria-hidden="true"></section>
  </div>
  <script src="./harness.js"></script>
</body>
</html>
